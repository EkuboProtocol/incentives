name: Fund drops

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency: fund

jobs:
  run:

    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: "0x00000C771F6176268D5A9846E0956C3eF58597A1"
            incentives_address: "0x934711c287c713e0953d1eb1cd66f5b3389889f7"
            chain_id: 1
            rpc_url_secret: "ETH_MAINNET_RPC_URL"
            private_key_secret: "ETH_MAINNET_INCENTIVES_PRIVATE_KEY"
            database: eth_mainnet
          - owner: "0x00000C771F6176268D5A9846E0956C3eF58597A1"
            incentives_address: "0x934711c287c713e0953d1eb1cd66f5b3389889f7"
            chain_id: 11155111
            rpc_url_secret: "ETH_SEPOLIA_RPC_URL"
            private_key_secret: "ETH_SEPOLIA_INCENTIVES_PRIVATE_KEY"
            database: eth_sepolia

    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm install

      - name: Fund drop
        env:
          PGHOST: ${{ secrets.POSTGRES_HOST }}
          PGPORT: ${{ secrets.POSTGRES_PORT }}
          PGDATABASE: ${{ matrix.database }}
          PGUSER: ${{ secrets.POSTGRES_USERNAME }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGSSLMODE: require
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          OWNER: ${{ matrix.owner }}
          INCENTIVES_ADDRESS: ${{ matrix.incentives_address }}
          CHAIN_ID: ${{ matrix.chain_id }}
          PRIVATE_KEY: ${{ secrets[matrix.private_key_secret] }}
          RPC_URL: ${{ secrets[matrix.rpc_url_secret] }}
        run: npm run fund-drops
