name: Fund drops

on:
  schedule:
    - cron: "15,30,45 12 * * *"
  workflow_dispatch:

concurrency: fund

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: "0x00000C771F6176268D5A9846E0956C3eF58597A1"
            incentives_address: "0xC52D2656cb8C634263E6A15469588beB9C3Bb738"
            chain_id: 1
            rpc_url_secret: "ETH_MAINNET_RPC_URL"
            private_key_secret: "ETH_MAINNET_INCENTIVES_PRIVATE_KEY"
          - owner: "0x00000C771F6176268D5A9846E0956C3eF58597A1"
            incentives_address: "0xC52D2656cb8C634263E6A15469588beB9C3Bb738"
            chain_id: 11155111
            rpc_url_secret: "ETH_SEPOLIA_RPC_URL"
            private_key_secret: "ETH_SEPOLIA_INCENTIVES_PRIVATE_KEY"

    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Fund drop
        env:
          PGHOST: ${{ secrets.POSTGRES_HOST }}
          PGPORT: ${{ secrets.POSTGRES_PORT }}
          PGDATABASE: ${{ secrets.POSTGRES_DATABASE }}
          PGUSER: ${{ secrets.POSTGRES_USERNAME }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGSSLMODE: require
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          OWNER: ${{ matrix.owner }}
          INCENTIVES_ADDRESS: ${{ matrix.incentives_address }}
          CHAIN_ID: ${{ matrix.chain_id }}
          PRIVATE_KEY: ${{ secrets[matrix.private_key_secret] }}
          RPC_URL: ${{ secrets[matrix.rpc_url_secret] }}
        run: bun fund-drops
