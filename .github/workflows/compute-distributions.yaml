name: Compute distributions

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

concurrency: distributions

jobs:
  run:
    strategy:
      matrix:
        database:
          - "eth_sepolia"
          - "sepolia"
          - "eth_mainnet"
          - "mainnet"

    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm install

      - name: Compute distributions
        env:
          PGHOST: ${{ secrets.POSTGRES_HOST }}
          PGPORT: ${{ secrets.POSTGRES_PORT }}
          PGUSER: ${{ secrets.POSTGRES_USERNAME }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGDATABASE: ${{ matrix.database }}
          PGSSLMODE: require
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          RUN_DATES: ${{ inputs.run_dates }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: npm run compute-distributions
