name: Create Defi Spring merkle root

on:
  workflow_dispatch:
    inputs:
      start_date:
        required: true
        description: "The ISO format start date of the date range for which to compute the merkle root"
      end_date:
        required: true
        description: "The ISO format end date of the date range for which to compute the merkle root, exclusive"

concurrency: query

jobs:
  run:
    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm install

      - name: Create merkle root
        env:
          PGHOST: ${{ secrets.POSTGRES_HOST }}
          PGPORT: ${{ secrets.POSTGRES_PORT }}
          # this only runs on the starknet mainnet database
          PGDATABASE: mainnet
          PGUSER: ${{ secrets.POSTGRES_USERNAME }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGSSLMODE: require
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: npm run create-defi-spring-root
