name: Generate drop

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency: generate-drop

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: "eth_mainnet"
            network_type: "EVM"
            positions_locker_address: "0xA37cc341634AFD9E0919D334606E676dbAb63E17"
          - database: "eth_sepolia"
            network_type: "EVM"
            positions_locker_address: "0xA37cc341634AFD9E0919D334606E676dbAb63E17"
          - database: "mainnet"
            network_type: "STARKNET"
            positions_locker_address: "0x02e0af29598b407c8716b17f6d2795eca1b471413fa03fb145a5e33722184067"
          - database: "sepolia"
            network_type: "STARKNET"
            positions_locker_address: "0x06a2aee84bb0ed5dded4384ddd0e40e9c1372b818668375ab8e3ec08807417e5"

    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Generate drop
        env:
          PGHOST: ${{ secrets.POSTGRES_HOST }}
          PGPORT: ${{ secrets.POSTGRES_PORT }}
          PGUSER: ${{ secrets.POSTGRES_USERNAME }}
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PGSSLMODE: require
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          PGDATABASE: ${{ matrix.database }}
          NETWORK_TYPE: ${{ matrix.network_type }}
          POSITIONS_LOCKER_ADDRESS: ${{ matrix.positions_locker_address }}
        run: bun generate-drop
